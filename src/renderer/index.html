<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
    <title>Pip</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage" data-mode="idle">
      <!-- Idle: just the blob -->
      <div id="blob-wrap" title="Click Pip to chat">
        <svg id="blob" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Pip the bookkeeper">
          <defs>
            <radialGradient id="pip-body" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#c7f0e3"/>
              <stop offset="60%" stop-color="#6fd3b7"/>
              <stop offset="100%" stop-color="#3fb08f"/>
            </radialGradient>
            <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
              <feOffset dx="0" dy="3" result="off"/>
              <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
              <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g id="pip-body-group" filter="url(#soft)">
            <path id="pip-body-path" d="M60,10 C86,10 106,32 106,60 C106,88 86,110 60,110 C34,110 14,88 14,60 C14,32 34,10 60,10 Z" fill="url(#pip-body)"/>
            <!-- little bow-tie -->
            <path d="M45,80 L60,74 L75,80 L70,85 L60,80 L50,85 Z" fill="#2b6a55" opacity="0.55"/>
            <!-- eyes -->
            <g id="pip-eyes">
              <ellipse class="eye" cx="46" cy="52" rx="4.5" ry="6" fill="#1a2f2a"/>
              <ellipse class="eye" cx="74" cy="52" rx="4.5" ry="6" fill="#1a2f2a"/>
              <circle class="glint" cx="47.5" cy="50" r="1.4" fill="#fff"/>
              <circle class="glint" cx="75.5" cy="50" r="1.4" fill="#fff"/>
            </g>
            <!-- mouth -->
            <path id="pip-mouth" d="M52,66 Q60,72 68,66" stroke="#1a2f2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
        <div id="thought-bubble" hidden></div>
      </div>

      <!-- Expanded panel -->
      <section id="panel" hidden>
        <header id="panel-header">
          <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">Pip</span>
            <span class="brand-role">bookkeeper</span>
          </div>
          <nav id="tabs">
            <button data-tab="chat" class="active">Chat</button>
            <button data-tab="books">Books</button>
            <button data-tab="reports">Reports</button>
            <button data-tab="settings">Settings</button>
          </nav>
          <button id="collapse" title="Collapse">×</button>
        </header>

        <div class="tab" data-tab="chat">
          <div id="messages" aria-live="polite"></div>
          <form id="composer">
            <input id="input" type="text" placeholder="e.g. $47 fuel BP today, business" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        </div>

        <div class="tab" data-tab="books" hidden>
          <div class="filters">
            <label>Entity
              <select id="books-entity">
                <option value="">All</option>
                <option value="business">Business</option>
                <option value="personal">Personal</option>
              </select>
            </label>
            <button id="books-refresh">Refresh</button>
          </div>
          <div id="books-list"></div>
        </div>

        <div class="tab" data-tab="reports" hidden>
          <div id="bas-card" class="card"></div>
          <div id="monthly-card" class="card"></div>
          <div id="category-card" class="card"></div>
        </div>

        <div class="tab" data-tab="settings" hidden>
          <form id="settings-form">
            <label>Anthropic API key
              <input type="password" name="apiKey" placeholder="sk-ant-..." />
            </label>
            <label>Business name
              <input type="text" name="businessName" placeholder="Your business trading name" />
            </label>
            <label>ABN
              <input type="text" name="abn" placeholder="11 digits, no spaces" />
            </label>
            <label>Bank CSV drop folder
              <div class="folder-row">
                <input type="text" name="csvDropFolder" readonly />
                <button type="button" data-pick="csvDropFolder">Choose…</button>
              </div>
            </label>
            <label>Receipts folder
              <div class="folder-row">
                <input type="text" name="receiptsFolder" readonly />
                <button type="button" data-pick="receiptsFolder">Choose…</button>
              </div>
            </label>
            <div class="settings-actions">
              <button type="submit">Save settings</button>
              <span id="settings-status"></span>
            </div>
            <div class="xero-block">
              <h4>Xero</h4>
              <p id="xero-status">Not connected. Sync to Xero is coming in a later release.</p>
            </div>
          </form>
        </div>
      </section>

      <!-- Review modal -->
      <div id="review-modal" hidden>
        <div class="review-inner">
          <h3>Review transaction</h3>
          <form id="review-form">
            <div class="row">
              <label>Entity
                <select name="entity">
                  <option value="personal">Personal</option>
                  <option value="business">Business</option>
                </select>
              </label>
              <label>Date
                <input type="date" name="date" />
              </label>
            </div>
            <label>Vendor
              <input type="text" name="vendor" />
            </label>
            <label>Description
              <input type="text" name="description" />
            </label>
            <div class="row">
              <label>Amount (AUD)
                <input type="number" step="0.01" name="amount_dollars" />
              </label>
              <label>Type
                <select name="direction">
                  <option value="expense">Expense (money out)</option>
                  <option value="income">Income (money in)</option>
                </select>
              </label>
            </div>
            <div class="row">
              <label>GST (AUD)
                <input type="number" step="0.01" name="gst_dollars" />
              </label>
              <label>Category
                <select name="category"></select>
              </label>
            </div>
            <label>Notes
              <textarea name="notes" rows="2"></textarea>
            </label>
            <div class="review-actions">
              <button type="button" data-action="reject">Reject</button>
              <button type="submit" data-action="approve">Approve &amp; save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="blob.js"></script>
    <script src="app.js"></script>
  </body>
</html>
